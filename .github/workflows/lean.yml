name: Lean proof check
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - run: lake update
      - run: lake exe cache get
      - run: lake build
      - run: |
          printf 'import Separator\n#print axioms Separator.diagonal\n#print axioms Separator.realizing\n#print axioms Separator.tight_restriction\n#print axioms Separator.partition_cost\n' > Audit.lean
          lake env lean Audit.lean | tee audit.log
          ! grep -q sorryAx audit.log


